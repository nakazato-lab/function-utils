name: Build and Push Function Utils

on:
  push:
    branches: [main]
  pull_request:

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      invoker: ${{ steps.filter.outputs.invoker }}
      registerer: ${{ steps.filter.outputs.registerer }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            invoker:
              - 'invoker/**'
              - 'utils/**'
            registerer:
              - 'registerer/**'
              - 'utils/**'

  build-and-push-invoker:
    needs: changes
    if: needs.changes.outputs.invoker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Invoker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./invoker/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.REGISTRY }}/${{ github.repository }}/ndn-function-invoker:latest
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  build-and-push-registerer:
    needs: changes
    if: needs.changes.outputs.registerer == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Registerer image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./registerer/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.REGISTRY }}/${{ github.repository }}/ndn-function-registerer:latest
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
